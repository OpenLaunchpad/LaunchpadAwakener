			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "# SMAppService.daemon(plistName:) reads this file out of the app bundle at registration\n# time. Generating it here instead of checking it in keeps Label and MachServices\n# in lock-step with INJECTION_SERVICE_NAME, which differs between Debug and Release. The daemon's\n# executable has one name in every configuration: Xcode does not evaluate a file reference's path\n# per configuration, so the Embed Daemon copy would look for the Debug name in a Release build.\nset -e\n\nLAUNCH_DAEMONS_DIRECTORY=\"${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Library/LaunchDaemons\"\nPROPERTY_LIST_PATH=\"${LAUNCH_DAEMONS_DIRECTORY}/${INJECTION_SERVICE_NAME}.plist\"\nPROPERTY_LIST_BUDDY=/usr/libexec/PlistBuddy\n\nmkdir -p \"${LAUNCH_DAEMONS_DIRECTORY}\"\nrm -f \"${PROPERTY_LIST_PATH}\"\n\nprintf '%s\\n' \\\n  '<?xml version=\"1.0\" encoding=\"UTF-8\"?>' \\\n  '<!DOCTYPE plist PUBLIC \"-//Apple//DTD PLIST 1.0//EN\" \"http://www.apple.com/DTDs/PropertyList-1.0.dtd\">' \\\n  '<plist version=\"1.0\"><dict/></plist>' > \"${PROPERTY_LIST_PATH}\"\n\n\"${PROPERTY_LIST_BUDDY}\" -c \"Add :Label string ${INJECTION_SERVICE_NAME}\" \"${PROPERTY_LIST_PATH}\"\n# BundleProgram is relative to the app bundle root, which is how SMAppService locates the\n# executable that Embed Daemon copied into Contents/Library/LaunchServices.\n\"${PROPERTY_LIST_BUDDY}\" -c \"Add :BundleProgram string Contents/Library/LaunchServices/LaunchpadAwakenerDaemon\" \"${PROPERTY_LIST_PATH}\"\n\"${PROPERTY_LIST_BUDDY}\" -c \"Add :KeepAlive bool true\" \"${PROPERTY_LIST_PATH}\"\n\"${PROPERTY_LIST_BUDDY}\" -c \"Add :MachServices dict\" \"${PROPERTY_LIST_PATH}\"\n\"${PROPERTY_LIST_BUDDY}\" -c \"Add :MachServices:${INJECTION_SERVICE_NAME} bool true\" \"${PROPERTY_LIST_PATH}\"\n\necho \"Generated ${PROPERTY_LIST_PATH}\"\n";
		};
