			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "# The standalone Launchpad, zipped into the app's resources. While System Integrity Protection is on,\n# the control panel installs it from there into the Applications folder (StandaloneLaunchpadInstaller).\n# A zip rather than the app itself, which LaunchServices could register and Spotlight list as a second\n# Launchpad running from inside this bundle.\nset -e\n\n# The standalone app is not installed on its own (SKIP_INSTALL), so in an archive BUILT_PRODUCTS_DIR\n# holds only a symbolic link to it. Resolve the link so the zip holds the app itself.\nSTANDALONE_APPLICATION_PATH=\"$(cd -P \"${BUILT_PRODUCTS_DIR}/Launchpad.app\" && pwd)\"\nSTAGING_DIRECTORY=\"${DERIVED_FILE_DIR}/StandaloneLaunchpad\"\nSTAGED_APPLICATION_PATH=\"${STAGING_DIRECTORY}/Launchpad.app\"\nARCHIVE_PATH=\"${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/Launchpad.zip\"\n\nrm -rf \"${STAGING_DIRECTORY}\"\nmkdir -p \"${STAGING_DIRECTORY}\"\n/usr/bin/ditto \"${STANDALONE_APPLICATION_PATH}\" \"${STAGED_APPLICATION_PATH}\"\n\n# Zipped, the standalone app never reaches export, which re-signs every piece of nested code for\n# distribution, yet the notary service looks inside the zip. Embedding a framework re-signs the\n# framework but not the bundles in its resources (AppKitPlus carries one with an executable), which keep\n# their vendor's signature. So sign those, then their frameworks, then the app, inside out, with this\n# build's identity and its timestamp setting.\nif [ -n \"${EXPANDED_CODE_SIGN_IDENTITY}\" ]; then\n    TIMESTAMP_ARGUMENT=\"--timestamp=none\"\n    case \" ${OTHER_CODE_SIGN_FLAGS} \" in\n        *\" --timestamp \"*) TIMESTAMP_ARGUMENT=\"--timestamp\" ;;\n    esac\n    sign_code() {\n        /usr/bin/codesign --force --sign \"${EXPANDED_CODE_SIGN_IDENTITY}\" \"${TIMESTAMP_ARGUMENT}\" \"$@\"\n    }\n    for FRAMEWORK_PATH in \"${STAGED_APPLICATION_PATH}\"/Contents/Frameworks/*.framework; do\n        [ -d \"${FRAMEWORK_PATH}\" ] || continue\n        for NESTED_BUNDLE_PATH in \"${FRAMEWORK_PATH}\"/Versions/Current/Resources/*.bundle; do\n            [ -d \"${NESTED_BUNDLE_PATH}/Contents/MacOS\" ] || continue\n            sign_code --options runtime \"${NESTED_BUNDLE_PATH}\"\n        done\n        sign_code --preserve-metadata=identifier \"${FRAMEWORK_PATH}\"\n    done\n    sign_code --preserve-metadata=identifier,entitlements,requirements,flags \"${STAGED_APPLICATION_PATH}\"\nfi\n\nrm -f \"${ARCHIVE_PATH}\"\n/usr/bin/ditto -c -k --keepParent \"${STAGED_APPLICATION_PATH}\" \"${ARCHIVE_PATH}\"\n\necho \"Embedded ${STANDALONE_APPLICATION_PATH} as ${ARCHIVE_PATH}\"\n\n# The Dock's Apps tile is handed the standalone app's icon: the Launchpad icon without the gear this\n# app's own icon carries, so the tile and this configuration app stay easy to tell apart\n# (DockAppsIconController). Xcode compiles both from AppIcon.icon, so this needs no extra tool and\n# follows that icon whenever it changes.\n#\n# The parts rather than a ready-made bundle: the payload renders through IconServices, which renders\n# an icon's light, dark and tinted appearances only from a bundle, but a .app in here would be nested\n# code that LaunchServices registers and every signing step has to carry. So the app assembles these\n# into a bundle under Application Support at runtime (DockAppsIconHost). Assets.car is what holds the\n# three appearances; AppIcon.icns is the fallback for anything that reads only that.\nDOCK_ICON_RESOURCES_PATH=\"${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/LaunchpadDockIcon\"\nrm -rf \"${DOCK_ICON_RESOURCES_PATH}\"\nmkdir -p \"${DOCK_ICON_RESOURCES_PATH}\"\nfor DOCK_ICON_RESOURCE_NAME in Assets.car AppIcon.icns; do\n    DOCK_ICON_SOURCE_PATH=\"${STANDALONE_APPLICATION_PATH}/Contents/Resources/${DOCK_ICON_RESOURCE_NAME}\"\n    if [ ! -f \"${DOCK_ICON_SOURCE_PATH}\" ]; then\n        echo \"error: ${DOCK_ICON_SOURCE_PATH} is missing; the Dock's Apps tile would have no icon to show\"\n        exit 1\n    fi\n    /bin/cp -f \"${DOCK_ICON_SOURCE_PATH}\" \"${DOCK_ICON_RESOURCES_PATH}/${DOCK_ICON_RESOURCE_NAME}\"\ndone\n\necho \"Copied the standalone app's icon resources to ${DOCK_ICON_RESOURCES_PATH}\"\n";
		};
