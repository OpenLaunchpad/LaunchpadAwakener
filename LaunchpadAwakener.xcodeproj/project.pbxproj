			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "# SMAppService.agent(plistName:) reads this file out of the app bundle at registration time.\n# Generated, as the daemon's is, so that Label and MachServices follow TEXT_INPUT_SERVICE_NAME,\n# which differs between Debug and Release.\nset -e\n\nLAUNCH_AGENTS_DIRECTORY=\"${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Library/LaunchAgents\"\nPROPERTY_LIST_PATH=\"${LAUNCH_AGENTS_DIRECTORY}/${TEXT_INPUT_SERVICE_NAME}.plist\"\nPROPERTY_LIST_BUDDY=/usr/libexec/PlistBuddy\n\nmkdir -p \"${LAUNCH_AGENTS_DIRECTORY}\"\nrm -f \"${PROPERTY_LIST_PATH}\"\n\nprintf '%s\\n' \\\n  '<?xml version=\"1.0\" encoding=\"UTF-8\"?>' \\\n  '<!DOCTYPE plist PUBLIC \"-//Apple//DTD PLIST 1.0//EN\" \"http://www.apple.com/DTDs/PropertyList-1.0.dtd\">' \\\n  '<plist version=\"1.0\"><dict/></plist>' > \"${PROPERTY_LIST_PATH}\"\n\n\"${PROPERTY_LIST_BUDDY}\" -c \"Add :Label string ${TEXT_INPUT_SERVICE_NAME}\" \"${PROPERTY_LIST_PATH}\"\n# Relative to the app bundle root: where Embed Text Input Helper copied the helper.\n\"${PROPERTY_LIST_BUDDY}\" -c \"Add :BundleProgram string Contents/Library/LoginItems/LaunchpadAwakenerTextInput.app/Contents/MacOS/LaunchpadAwakenerTextInput\" \"${PROPERTY_LIST_PATH}\"\n\"${PROPERTY_LIST_BUDDY}\" -c \"Add :MachServices dict\" \"${PROPERTY_LIST_PATH}\"\n\"${PROPERTY_LIST_BUDDY}\" -c \"Add :MachServices:${TEXT_INPUT_SERVICE_NAME} bool true\" \"${PROPERTY_LIST_PATH}\"\n# Started by launchd when the payload in the Dock connects, and only in a login session's GUI.\n\"${PROPERTY_LIST_BUDDY}\" -c \"Add :LimitLoadToSessionType string Aqua\" \"${PROPERTY_LIST_PATH}\"\n\"${PROPERTY_LIST_BUDDY}\" -c \"Add :ProcessType string Interactive\" \"${PROPERTY_LIST_PATH}\"\n\necho \"Generated ${PROPERTY_LIST_PATH}\"\n";
